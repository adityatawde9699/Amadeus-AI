name: CI/CD Pipeline

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # Security Scan (GitGuardian)
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for secret scanning

      # Blocking secret scan that needs no API key. On push/PR it scans only the
      # new commits, so the (rotated) historical Amadeus/.env leak doesn't fail
      # every run until history is purged.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Blocking when configured; skipped (not silently passed) when the
      # GITGUARDIAN_API_KEY secret is absent.
      - name: GitGuardian Scan
        if: env.GITGUARDIAN_API_KEY != ''
        uses: GitGuardian/ggshield-action@v1.27.0

  # ---------------------------------------------------------------------------
  # Quality Gates: Lint, Type Check, Security Audit
  # ---------------------------------------------------------------------------
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned: requires-python is open-ended (>=3.11), so the file would pick
          # the newest CPython (3.15), which onnxruntime has no wheels for yet.
          # 3.11 matches the Dockerfile base image and mypy python_version.
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/

      - name: Shell scripts (syntax + shellcheck)
        run: |
          bash -n scripts/install_gpu_backend.sh
          shellcheck -S warning scripts/install_gpu_backend.sh

      # Blocking. pyproject pins platform=linux / python 3.11 so local runs match.
      - name: Type check (mypy)
        run: uv run mypy src/ --ignore-missing-imports

      - name: Security scan (bandit)
        # Whole of src/ (tools/ included: it is the riskiest code). -ll and
        # --severity-level are mutually exclusive; the old command errored out
        # before scanning anything.
        run: uv run bandit -r src/ --severity-level high

      - name: Dependency audit (pip-audit)
        # Audits the whole lockfile (all extras), not just what this job installed.
        # PYSEC-2026-2447: diskcache (via llama-cpp-python) has no fixed release;
        # Amadeus never points diskcache at untrusted cache directories.
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project > /tmp/audit-reqs.txt
          uv run pip-audit --requirement /tmp/audit-reqs.txt --no-deps --disable-pip \
            --ignore-vuln PYSEC-2026-2447

  # ---------------------------------------------------------------------------
  # Test Suite: Real PostgreSQL + Redis
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: amadeus
          POSTGRES_PASSWORD: amadeus_test_pass
          POSTGRES_DB: amadeus_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned: requires-python is open-ended (>=3.11), so the file would pick
          # the newest CPython (3.15), which onnxruntime has no wheels for yet.
          # 3.11 matches the Dockerfile base image and mypy python_version.
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Blocking: the migration chain must apply to an empty database and
      # survive a full downgrade/upgrade round trip.
      - name: Apply database migrations
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://amadeus:amadeus_test_pass@localhost:5432/amadeus_test
          SKIP_CONFIG_VALIDATION: "true"
          ENV: development

      # Blocking: the ORM models and the migration chain must agree.
      - name: Check models match migrations
        run: uv run alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://amadeus:amadeus_test_pass@localhost:5432/amadeus_test
          SKIP_CONFIG_VALIDATION: "true"
          ENV: development

      # Coverage gate is a RATCHET just under the measured total (59% on
      # 2026-11-13, up from 47%). Raise it as coverage grows; never lower it.
      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=57 \
            -v
        env:
          # tests/conftest.py pins DATABASE_URL to a throwaway SQLite DB unless
          # AMADEUS_TEST_DATABASE_URL is set — use the Postgres service in CI.
          AMADEUS_TEST_DATABASE_URL: postgresql+asyncpg://amadeus:amadeus_test_pass@localhost:5432/amadeus_test
          DATABASE_URL: postgresql+asyncpg://amadeus:amadeus_test_pass@localhost:5432/amadeus_test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'test-secret-key-32-chars-minimum-xx' }}
          REDIS_URL: redis://localhost:6379/0
          SKIP_CONFIG_VALIDATION: "true"
          ENV: development

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml

  # ---------------------------------------------------------------------------
  # Docker Verification
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build Check
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Load
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: amadeus-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The CUDA variant (LLAMA_BACKEND=cuda) compiles llama.cpp's CUDA kernels,
      # which takes too long for every push. Lint its build path instead; the
      # full build is exercised locally (see wiki/GPU-Acceleration.md).
      - name: Check CUDA Dockerfile variant
        run: docker build --check --build-arg LLAMA_BACKEND=cuda .

  # ---------------------------------------------------------------------------
  # Deploy: Railway — every push to master (the only branch) deploys prod.
  # Skipped, not failed, until the RAILWAY_TOKEN secret is configured.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Railway
    needs: [test, docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Skip without RAILWAY_TOKEN
        if: env.RAILWAY_TOKEN == ''
        run: echo "::notice::RAILWAY_TOKEN secret not set; skipping deploy."
      - uses: actions/checkout@v4
        if: env.RAILWAY_TOKEN != ''
      - name: Deploy
        if: env.RAILWAY_TOKEN != ''
        # Pinned by commit (0.1.2-beta) — a branch ref would run whatever
        # upstream pushes, with RAILWAY_TOKEN in scope.
        uses: bervProject/railway-deploy@28e06ba62ca4186e60db75554ee73dda1e4e5450
        with:
          service: amadeus-api-prod

  # ---------------------------------------------------------------------------
  # Release: on push to master, once per pyproject version. Bump `version` in
  # pyproject.toml to cut a release; pushes with an already-tagged version
  # do nothing (previously this would have rewritten the existing release).
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [test, docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(grep -m 1 'version = ' pyproject.toml | cut -d '"' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "::notice::v$VERSION is already tagged; no release created."
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.get_version.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
