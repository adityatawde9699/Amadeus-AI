name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # Security Scan (GitGuardian)
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for ggshield scan

      - name: GitGuardian Scan
        uses: GitGuardian/ggshield-action@v1.27.0
        continue-on-error: true  # Don't block CI when GITGUARDIAN_API_KEY secret is absent
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  # ---------------------------------------------------------------------------
  # Quality Gates: Lint, Type Check, Security Audit
  # ---------------------------------------------------------------------------
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check src/

      - name: Type check (mypy)
        run: uv run mypy src/ --ignore-missing-imports

      - name: Security scan (bandit)
        run: uv run bandit -r src/ -ll -x src/infra/tools/ --severity-level high

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit --requirement <(uv pip freeze) --ignore-vuln CVE-2024-23342

  # ---------------------------------------------------------------------------
  # Test Suite: Real PostgreSQL + Redis
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: amadeus
          POSTGRES_PASSWORD: amadeus_test_pass
          POSTGRES_DB: amadeus_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check database migrations
        run: uv run alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://amadeus:amadeus_test_pass@localhost:5432/amadeus_test
          SKIP_CONFIG_VALIDATION: "true"
          ENV: development

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v
        env:
          DATABASE_URL: postgresql+asyncpg://amadeus:amadeus_test_pass@localhost:5432/amadeus_test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'test-secret-key-32-chars-minimum-xx' }}
          REDIS_URL: redis://localhost:6379/0
          SKIP_CONFIG_VALIDATION: "true"
          ENV: development

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml

  # ---------------------------------------------------------------------------
  # Docker Verification
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build Check
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Load
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: amadeus-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Auto-train ML Classifier
  # ---------------------------------------------------------------------------
  train-model:
    name: Train ML Classifier
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            data:
              - 'data/training_data.json'
              
      - name: Install uv
        if: steps.filter.outputs.data == 'true'
        uses: astral-sh/setup-uv@v5
        
      - name: Set up Python
        if: steps.filter.outputs.data == 'true'
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
          
      - name: Install dependencies
        if: steps.filter.outputs.data == 'true'
        run: uv sync --all-extras --dev
        
      - name: Train model
        if: steps.filter.outputs.data == 'true'
        run: uv run python scripts/train_classifier.py
        
      - name: Commit and push changes
        if: steps.filter.outputs.data == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Model/
          git commit -m "Auto-update tool classifier models [skip ci]" || echo "No changes to commit"
          git push

  # ---------------------------------------------------------------------------
  # Deploy: Railway (Static environment mapping)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Railway
    needs: [test, docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: bervProject/railway-deploy@main
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        with:
          service: ${{ github.ref == 'refs/heads/main' && 'amadeus-api-prod' || 'amadeus-api-staging' }}

  # ---------------------------------------------------------------------------
  # Release: Auto-tagging on Push to Main
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [test, docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(grep -m 1 'version = ' pyproject.toml | cut -d '"' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
