[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amadeus-ai"
version = "3.1.0"
description = "A production-ready AI voice assistant built with Clean Architecture principles"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Aditya Tawde", email = "adityatawde9699@gmail.com"}
]
keywords = ["ai", "assistant", "voice", "llm", "fastapi", "clean-architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    # Web / API
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.37.0",
    "apscheduler>=3.10.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    # Validation / Config
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "fastapi-users[sqlalchemy]>=13.0.0",
    # Dependency Injection
    "dependency-injector>=4.41.0",
    # Utilities / System
    "psutil>=5.9.0",
    "rapidfuzz>=3.6.0",
    # Image / OCR
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    # Generative AI
    "google-genai>=0.1.0",
    "numpy>=1.26.0,<2.0.0",
    # HTTP Client
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    # Rate Limiting
    "slowapi>=0.1.9",
    # Natural Language Parsing
    "dateparser>=1.2.0",
    # Observability
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # Email (Phase 4)
    "imap-tools>=1.5.0",
    "aiosmtplib>=3.0.0",
    # HTML Parsing (Phase 4 — email cleaning + web research)
    "beautifulsoup4>=4.12.0",
    # Vector Memory (Long-term semantic recall)
    "qdrant-client>=1.7.0",
    # Sandbox (Docker-based code execution)
    "docker>=7.0.0",
    # Telegram Bot (v20+ async, webhook-native)
    "python-telegram-bot[webhooks]>=20.7",
    "sentence-transformers>=5.4.1",
    "rank-bm25>=0.2.2",
    "pycaw>=20251023",

    "wmi>=1.5.1",
]

[project.optional-dependencies]
# Voice features - requires system dependencies (portaudio) and Rust
voice = [
    "SpeechRecognition>=3.10.0",
    "faster-whisper>=0.10.0",
    "edge-tts>=6.1.0",
    "elevenlabs>=1.0.0",
]

# Dashboard UI
dashboard = [
    "streamlit>=1.30.0",
    "streamlit-lottie>=0.0.5",
    "streamlit-mic-recorder>=0.0.8",
]

dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",  # For FastAPI TestClient
    "testcontainers[postgres]>=4.0.0",
    
    # Code Quality
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    
    # Security
    "bandit>=1.7.0",
    "pip-audit>=2.0.0",
    "pre-commit>=3.7.0",

    
    # Type Stubs
    "types-psutil>=5.9.0",
    "types-requests>=2.31.0",
]

test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

# Full installation with all features
all = [
    "amadeus-ai[voice,dashboard,dev]",
]

# Multi-LLM providers (optional cost saver)
llm = [
    "groq>=0.4.0",
    "openai>=1.0.0",
]

[project.scripts]
amadeus = "src.api.server:main"

[project.urls]
Homepage = "https://github.com/adityatawde9699/Amadeus-AI"
Documentation = "https://github.com/adityatawde9699/Amadeus-AI#readme"
Repository = "https://github.com/adityatawde9699/Amadeus-AI.git"
Issues = "https://github.com/adityatawde9699/Amadeus-AI/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ============================================================================
# TOOL CONFIGURATIONS
# ============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 80

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | amadeus_venv
    | _build
    | buck-out
    | build
    | dist
    | Amadeus  # Exclude legacy code
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "amadeus_venv",
    "Amadeus",  # Exclude legacy code
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C90",  # mccabe complexity
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "EXE",  # flake8-executable
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate
    "PL",   # Pylint
    "TRY",  # tryceratops
    "RUF",  # Ruff-specific rules
]
ignore = [
    # --- Already suppressed ---
    "S101",    # assert is fine in tests
    "PLR0913", # Too many arguments — FastAPI route signatures are verbose by design
    "TRY003",  # Long exception messages are acceptable

    # --- FastAPI / Dependency Injection patterns ---
    "B008",    # Depends() in default args — this IS the FastAPI DI pattern
    "ARG001",  # Unused function arg — required by FastAPI signature dispatch
    "ARG002",  # Unused method arg — required by fastapi-users hook signatures

    # --- Intentional deferred imports (circular-import avoidance) ---
    "PLC0415", # import-outside-top-level — used deliberately throughout for circular safety
    "E402",    # module-import-not-at-top — same reason (lifespan, route registration order)

    # --- Try/except style — existing project convention ---
    "TRY300",  # try-consider-else — opinionated; existing style is correct
    "TRY301",  # raise-within-try — common FastAPI HTTPException pattern
    "TRY401",  # verbose-log-message — logger.exception(f"msg {e}") is the project standard

    # --- Private-member access (controlled & intentional) ---
    "SLF001",  # Private member access — e.g. semaphore._value, _tool_metadata are intentional

    # --- Magic values — HTTP status codes & domain constants are self-documenting ---
    "PLR2004", # magic-value-comparison — port 8080, status 200 etc. are readable inline

    # --- Complexity — architectural, not fixable by linting ---
    "C901",    # complex-structure — refactoring scope is out of this sweep
    "PLR0911", # too-many-return-statements — same
    "PLR0912", # too-many-branches — same
    "PLR0915", # too-many-statements — same

    # --- Global statements (intentional singletons/scheduler) ---
    "PLW0603", # global-statement — used for scheduler and singleton state intentionally

    # --- Datetime timezone — non-security-critical internal scheduling ---
    "DTZ005",  # call-datetime-now-without-tzinfo
    "DTZ003",  # call-datetime-utcnow
    "DTZ011",  # call-date-today
    "DTZ006",  # call-datetime-fromtimestamp

    # --- Security warnings for intentional patterns ---
    "S110",    # try-except-pass — always accompanied by a logger or comment
    "S306",    # suspicious-mktemp-usage — used in Whisper temp file pipeline
    "S307",    # suspicious-eval-usage — controlled eval in tool execution
    "S603",    # subprocess-without-shell-equals-true — intentional
    "S311",    # non-cryptographic random — used for session/display purposes only
    "S606",    # start-process-with-no-shell — intentional system tool invocation
    "S607",    # start-process-with-partial-path — intentional system tool invocation

    # --- Commented-out code (too many false positives on # noqa, # type:, docstrings) ---
    "ERA001",  # commented-out-code

    # --- Unicode / emoji in log messages are intentional ---
    "RUF001",  # ambiguous-unicode-character — emoji in logger output is intentional

    # --- Fire-and-forget async tasks are intentional in proactive loop ---
    "RUF006",  # asyncio-dangling-task

    # --- Raise-from style (will be fixed separately, too many edge cases) ---
    "B904",    # raise-without-from-inside-except — too widespread; track as tech debt

    # --- try-except-pass with logging is acceptable ---
    "S110",    # already listed above

    # --- Line length --- all remaining E501 are in tool description strings / comments ---
    "E501",    # line-too-long — unavoidable for tool descriptions and URLs

    # --- Property naming convention ---
    "N802",    # invalid-function-name — AGENT_WORKSPACE property follows settings naming convention

    # --- pytest-style composite assertion rule firing in production code (not tests) ---
    "PT018",   # pytest-composite-assertion — triggered on runtime assert guards in adapters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false
lines-after-imports = 2

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_equality = true
strict_concatenate = true
exclude = [
    "Amadeus/",  # Exclude legacy code
    "amadeus_venv/",
]

[[tool.mypy.overrides]]
module = [
    "pyttsx3.*",
    "speech_recognition.*",
    "faster_whisper.*",
    "streamlit.*",
    "streamlit_lottie.*",
    "streamlit_mic_recorder.*",
    "google.genai.*",
    "pytesseract.*",
    "jose.*",
    "apscheduler.*",
    "joblib.*",
    "redis.*",
    "slack_sdk.*",
    "locust.*",
    "win32com.*",
    "pywintypes.*",
    "win32api.*",
    "telegram.*",
    "imap_tools.*",
    "aiosmtplib.*",
    "dateparser.*",
    "qdrant_client.*",
    "structlog.*",
    "sentry_sdk.*",
    "slowapi.*",
    "prometheus_fastapi_instrumentator.*",
    "groq.*",
    "openai.*",
    "edge_tts.*",
    "elevenlabs.*",
    "fastapi_users.*",
    "fastapi_users_db_sqlalchemy.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "anyio>=4.12.1",
    "pre-commit>=3.7.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
