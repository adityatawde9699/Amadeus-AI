# Held-out routing queries: hand-written, deliberately phrased unlike
# TRAINING_DATA (src/app/services/category_classifier.py). Never add these to
# TRAINING_DATA — that would turn this into a training-set score. The runner
# refuses exact overlaps.
#
# Labels follow the category the *registered tool* lives in (e.g. pomodoro and
# notes tools are TASK_MANAGER), not intuition. Only include requests some
# registered tool can serve.
app_control:
  - fire up the spotify app for me
  - could you bring up visual studio code
  - kill the firefox window
  - I need notepad open please
file_system:
  - where did I save the invoice pdf
  - list everything inside my downloads folder
  - rename draft.txt to final.txt
  - copy the photos directory to my backup drive
os_control:
  - turn the sound down a bit
  - make the screen brighter
  - put the laptop to sleep
  - grab a screenshot of my desktop
monitoring:
  - is my ram almost full
  - how hot is the cpu running
  - which processes are hogging memory
  - how much disk space do I have left
