<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Amadeus AI — Local-first autonomous AI runtime">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="0.55" stop-color="#0E1626"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#7DB4FF"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#22D3EE"/>
    </marker>
  </defs>

  <!-- Card -->
  <rect x="0" y="0" width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="340" rx="24" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="23.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>
  <ellipse cx="300" cy="150" rx="380" ry="240" fill="url(#glow)"/>

  <!-- Left content -->
  <g transform="translate(64,0)">
    <text x="0" y="86" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="4" fill="#7DD3FC">LOCAL-FIRST · AUTONOMOUS · HEADLESS DAEMON</text>

    <text x="-3" y="168" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" fill="url(#title)">Amadeus AI</text>

    <text x="0" y="212" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#CBD5E1">The autonomous AI runtime that plans, acts, verifies, and remembers.</text>

    <text x="0" y="248" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#8B97A7">local GGUF → Groq → Gemini &#160;·&#160; 70+ sandboxed tools &#160;·&#160; PostgreSQL memory</text>

    <!-- Chips -->
    <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">
      <g transform="translate(0,275)">
        <rect x="0" y="0" width="118" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="59" y="20" text-anchor="middle" fill="#93C5FD">LangGraph core</text>
      </g>
      <g transform="translate(130,275)">
        <rect x="0" y="0" width="158" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="79" y="20" text-anchor="middle" fill="#93C5FD">Fail-closed security</text>
      </g>
      <g transform="translate(300,275)">
        <rect x="0" y="0" width="132" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="66" y="20" text-anchor="middle" fill="#93C5FD">Persistent memory</text>
      </g>
    </g>
  </g>

  <!-- Right: LangGraph cognitive loop (Plan → Act → Verify → Remember) -->
  <g transform="translate(0,4)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#94A3B8">
    <!-- edges -->
    <g fill="none" stroke="url(#edge)" stroke-width="2.2" stroke-opacity="0.85">
      <path d="M958 92 C1030 96, 1064 116, 1078 146" marker-end="url(#arrow)"/>
      <path d="M1072 176 C1050 210, 1010 226, 972 232" marker-end="url(#arrow)"/>
      <path d="M940 244 C904 232, 892 196, 908 166" marker-end="url(#arrow)"/>
      <path d="M930 138 C936 122, 944 108, 948 100" marker-end="url(#arrow)"/>
    </g>

    <!-- nodes -->
    <g>
      <circle cx="948" cy="92" r="10" fill="#0B1220" stroke="#60A5FA" stroke-width="2.5"/>
      <circle cx="948" cy="92" r="3.5" fill="#60A5FA"/>
      <text x="964" y="88" fill="#CBD5E1">Plan</text>

      <circle cx="1086" cy="158" r="10" fill="#0B1220" stroke="#22D3EE" stroke-width="2.5"/>
      <circle cx="1086" cy="158" r="3.5" fill="#22D3EE"/>
      <text x="1010" y="154" text-anchor="end" fill="#CBD5E1">Act</text>

      <circle cx="960" cy="240" r="10" fill="#0B1220" stroke="#34D399" stroke-width="2.5"/>
      <circle cx="960" cy="240" r="3.5" fill="#34D399"/>
      <text x="976" y="262" fill="#CBD5E1">Verify</text>

      <circle cx="912" cy="150" r="10" fill="#0B1220" stroke="#A78BFA" stroke-width="2.5"/>
      <circle cx="912" cy="150" r="3.5" fill="#A78BFA"/>
      <text x="896" y="146" text-anchor="end" fill="#CBD5E1">Remember</text>
    </g>
  </g>
</svg>
