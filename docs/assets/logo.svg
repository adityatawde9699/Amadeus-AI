<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" role="img" aria-label="Amadeus AI">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="0.55" stop-color="#0E1626"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>
    <linearGradient id="lwm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#7DB4FF"/>
    </linearGradient>
    <linearGradient id="ledge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
