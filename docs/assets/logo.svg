    <radialGradient id="lglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <marker id="larrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#22D3EE"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="460" height="120" rx="22" fill="url(#lbg)"/>
  <rect x="0.75" y="0.75" width="458.5" height="118.5" rx="21.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5"/>
  <ellipse cx="64" cy="60" rx="70" ry="60" fill="url(#lglow)"/>

  <!-- Cognitive-loop emblem -->
  <g transform="translate(64,60)">
    <g fill="none" stroke="url(#ledge)" stroke-width="2.4" stroke-opacity="0.9">
      <path d="M2 -27 C20 -20, 28 -4, 25 12" marker-end="url(#larrow)"/>
      <path d="M20 20 C6 30, -12 28, -22 16" marker-end="url(#larrow)"/>
      <path d="M-26 6 C-30 -12, -20 -24, -6 -27" marker-end="url(#larrow)"/>
    </g>
    <circle cx="0" cy="-30" r="8" fill="#0B1220" stroke="#60A5FA" stroke-width="2.4"/>
    <circle cx="0" cy="-30" r="3" fill="#60A5FA"/>
    <circle cx="27" cy="16" r="8" fill="#0B1220" stroke="#22D3EE" stroke-width="2.4"/>
    <circle cx="27" cy="16" r="3" fill="#22D3EE"/>
    <circle cx="-27" cy="16" r="8" fill="#0B1220" stroke="#A78BFA" stroke-width="2.4"/>
    <circle cx="-27" cy="16" r="3" fill="#A78BFA"/>
  </g>

  <!-- Wordmark -->
  <text x="128" y="58" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="url(#lwm)">Amadeus AI</text>
  <text x="130" y="84" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" letter-spacing="2.5" fill="#8B97A7">AUTONOMOUS · LOCAL-FIRST</text>
