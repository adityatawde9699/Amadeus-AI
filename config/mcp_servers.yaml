# MCP servers connected at startup when ENABLE_MCP=true.
#
# SECURITY: every MCP tool is treated as high-risk by default — it requires the
# STANDARD profile and human confirmation before each call. List a tool under
# `read_only_tools` only if you have verified it has no side effects; those run
# without confirmation and are available to READ_ONLY sessions.
#
# `env` is merged over the MCP SDK's minimal default environment (PATH, HOME,
# ...). `${VAR}` is expanded from the daemon's environment; an entry whose
# variable is unset is skipped with a warning.
mcp_servers:
  - name: filesystem
    # Scoped to the agent workspace (relative to the project root / CWD), never
    # a home directory — the agent's own filesystem tools use the same sandbox.
    command: "npx -y @modelcontextprotocol/server-filesystem ./data/agent_workspace"
    enabled: false
    read_only_tools:
      - read_file
      - read_text_file
      - list_directory
      - search_files
      - get_file_info
      - list_allowed_directories
  - name: github
    command: "npx -y @modelcontextprotocol/server-github"
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
    enabled: false
  - name: postgres
    command: "npx -y @modelcontextprotocol/server-postgres"
    env:
      DATABASE_URL: "${DATABASE_URL}"
    enabled: false
