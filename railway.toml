# =============================================================================
# Railway Deployment Configuration
# =============================================================================
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "pip install -e .[voice]"

[deploy]
# Run Alembic migrations before starting the server
startCommand = "python -m alembic upgrade head && uvicorn src.api.server:app --host 0.0.0.0 --port $PORT"

# Railway health check
healthcheckPath = "/health"
healthcheckTimeout = 30

# Restart policy: retry on failure, max 3 times
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "amadeus-api"
