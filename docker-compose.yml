# =============================================================================
# Amadeus AI - Docker Compose Configuration
# =============================================================================
# Development and production profiles for the AI assistant
#
# Usage:
#   Development: docker-compose up --build
#   Production:  docker-compose --profile prod up --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API Service (Development)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: amadeus-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql://amadeus:amadeus_password@postgres:5432/amadeus_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - LOG_LEVEL=INFO
    volumes:
      # Mount source code for hot-reload during development
      - ./src:/app/src:ro
      # Persist data (if needed for other files)
      - amadeus-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/detailed')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - amadeus-network

  # ---------------------------------------------------------------------------
  # API Service (Production)
  # ---------------------------------------------------------------------------
  api-prod:
    profiles:
      - prod
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: amadeus-api-prod
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql://amadeus:amadeus_password@postgres:5432/amadeus_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - LOG_LEVEL=WARNING
    command: gunicorn -k uvicorn.workers.UvicornWorker --workers 4 --bind 0.0.0.0:8000 src.api.server:app
    volumes:
      - amadeus-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/detailed')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - amadeus-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ---------------------------------------------------------------------------
  # Database Service (PostgreSQL)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: amadeus-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=amadeus
      - POSTGRES_PASSWORD=amadeus_password
      - POSTGRES_DB=amadeus_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U amadeus -d amadeus_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - amadeus-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  amadeus-data:
    driver: local
  postgres-data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  amadeus-network:
    driver: bridge
