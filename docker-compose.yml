# =============================================================================
# Amadeus AI — docker-compose (hardened, Phase 4.4)
# =============================================================================
# Security posture:
#   * Datastores (postgres / redis / qdrant) and tracing publish NO host ports —
#     they are reachable only on the internal compose network by service name.
#     This removes the public, often-unauthenticated attack surface (an exposed
#     Redis/Qdrant on 0.0.0.0 is a well-known RCE/data-exfil vector).
#   * The API publishes only on loopback (127.0.0.1) — put a TLS reverse proxy
#     in front for external access rather than binding 0.0.0.0 directly.
#   * Images are pinned to explicit versions (not :latest). Operators SHOULD
#     additionally pin by digest (image@sha256:...) after verifying the tag, for
#     full supply-chain reproducibility.
# =============================================================================
version: '3.8'

services:
  amadeus:
    build: .
    container_name: amadeus_runtime
    restart: always
    environment:
      - ENV=production
      - DATABASE_URL=postgresql+asyncpg://amadeus:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/amadeus
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_ENABLED=True
      - QDRANT_HOST=qdrant
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY via .env or environment}
    ports:
      # Loopback-only: do not expose the API directly on a public interface.
      - "127.0.0.1:8000:8000"
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./data:/app/data

  worker:
    build: .
    container_name: amadeus_worker
    restart: always
    command: ["uv", "run", "arq", "src.infra.queue.worker.WorkerSettings"]
    environment:
      - ENV=production
      - DATABASE_URL=postgresql+asyncpg://amadeus:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/amadeus
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    volumes:
      - ./data:/app/data

  postgres:
    image: postgres:15.7-alpine  # pin by digest in production after verifying
    container_name: amadeus_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-amadeus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-amadeus}
    # No host port mapping — reachable only as "postgres" on the compose network.
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine  # pin by digest in production after verifying
    container_name: amadeus_redis
    restart: always
    # No host port mapping — an exposed Redis is a critical RCE/exfil risk.
    volumes:
      - redisdata:/data

  qdrant:
    image: qdrant/qdrant:v1.9.2  # pin by digest in production after verifying
    container_name: amadeus_qdrant
    restart: always
    # No host port mapping — reachable only as "qdrant" on the compose network.
    volumes:
      - qdrantdata:/qdrant/storage

  jaeger:
    image: jaegertracing/all-in-one:1.57  # pin by digest in production after verifying
    container_name: amadeus_jaeger
    restart: always
    ports:
      # Only the UI, bound to loopback. OTLP ingest (4317/4318) stays on the
      # internal network — the app sends spans by service name, no host exposure.
      - "127.0.0.1:16686:16686"

volumes:
  pgdata:
  redisdata:
  qdrantdata:
