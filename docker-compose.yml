version: '3.8'

services:
  amadeus:
    build: .
    container_name: amadeus_runtime
    restart: always
    environment:
      - ENV=production
      - DATABASE_URL=postgresql+asyncpg://amadeus:password@postgres:5432/amadeus
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_ENABLED=True
      - QDRANT_HOST=qdrant
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./data:/app/data

  worker:
    build: .
    container_name: amadeus_worker
    restart: always
    command: ["uv", "run", "arq", "src.infra.queue.worker.WorkerSettings"]
    environment:
      - ENV=production
      - DATABASE_URL=postgresql+asyncpg://amadeus:password@postgres:5432/amadeus
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    volumes:
      - ./data:/app/data

  postgres:
    image: postgres:15-alpine
    container_name: amadeus_postgres
    restart: always
    environment:
      - POSTGRES_USER=amadeus
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=amadeus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: amadeus_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: amadeus_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: amadeus_jaeger
    restart: always
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  pgdata:
  redisdata:
  qdrantdata:
